# Render blueprint: runs Vetter's server (the site, each job's page, and the AI endpoints).
# On render.com: New > Blueprint > pick this repository. Fill in ANTHROPIC_API_KEY and SITE_URL when asked.
services:
  - type: web
    name: vetter
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Your Anthropic key, for writing and marking tests. Kept secret by Render; never in the code
      - key: ANTHROPIC_API_KEY
        sync: false
      # The site's public address, e.g. https://vetter.onrender.com or your own domain. Used for job links and the sitemap
      - key: SITE_URL
        sync: false
      # Firebase web app settings, for accounts (Project settings > Your apps in the Firebase console). Public, not secrets
      - key: VITE_FIREBASE_API_KEY
        value: "AIzaSyByK-3EOUne814-fKW9n5rqVOcNFXqXlLE"
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: "vetter-7b06f.firebaseapp.com"
      - key: VITE_FIREBASE_PROJECT_ID
        value: "vetter-7b06f"
      - key: VITE_FIREBASE_APP_ID
        value: "1:1043391834562:web:a7a06781505cbc99568e5b"
